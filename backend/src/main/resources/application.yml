server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 2h
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
spring:
  application:
    name: campushub
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:54329/campushub}
    username: ${DB_USERNAME:campushub}
    password: ${DB_PASSWORD:campushub_local_dev}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  session:
    jdbc:
      initialize-schema: never
  jackson:
    time-zone: Asia/Shanghai
  mvc:
    problemdetails:
      enabled: true
campushub:
  seed-demo: ${SEED_DEMO:false}
  admin-username: ${ADMIN_USERNAME:admin}
  admin-password: ${ADMIN_PASSWORD:}
logging:
  level:
    root: INFO
    org.springframework.security: WARN
