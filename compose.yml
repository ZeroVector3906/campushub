services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: campushub
      POSTGRES_USER: campushub
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campushub -d campushub"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://db:5432/campushub
      DB_USERNAME: campushub
      DB_PASSWORD: ${DB_PASSWORD:?请设置 DB_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请设置至少 12 位的管理员密码}
      SEED_DEMO: ${SEED_DEMO:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TZ: Asia/Shanghai
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres-data:
